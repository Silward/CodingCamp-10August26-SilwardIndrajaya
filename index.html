<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>To-Do Life Dashboard</h1>
  </header>

  <main>
    <!-- Greeting Panel -->
    <section id="greeting-panel" aria-labelledby="greeting-heading">
      <h2 id="greeting-heading">Greeting</h2>
      <p id="current-time" aria-live="polite" aria-label="Current time"></p>
      <p id="current-date" aria-label="Current date"></p>
      <p id="greeting-message" aria-live="polite" aria-label="Greeting message"></p>
    </section>

    <!-- Focus Timer -->
    <section id="focus-timer" aria-labelledby="timer-heading">
      <h2 id="timer-heading">Focus Timer</h2>
      <div id="timer-display" aria-live="polite" aria-label="Timer countdown">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" type="button" aria-label="Start timer">Start</button>
        <button id="timer-stop" type="button" aria-label="Stop timer" disabled>Stop</button>
        <button id="timer-reset" type="button" aria-label="Reset timer" disabled>Reset</button>
      </div>
    </section>

    <!-- Task Manager -->
    <section id="task-manager" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Task Manager</h2>
      <form id="task-form" aria-label="Add new task">
        <label for="task-input" class="sr-only">New task</label>
        <input
          type="text"
          id="task-input"
          placeholder="Add a new task..."
          maxlength="256"
          aria-describedby="task-error"
        >
        <button type="submit" aria-label="Add task">Add</button>
        <p id="task-error" role="alert" aria-live="assertive" class="error-message"></p>
      </form>
      <ul id="task-list" aria-label="To-do tasks"></ul>
    </section>

    <!-- Quick Links -->
    <section id="quick-links" aria-labelledby="links-heading">
      <h2 id="links-heading">Quick Links</h2>
      <form id="link-form" aria-label="Add new quick link">
        <div class="link-form-fields">
          <div class="form-group">
            <label for="link-url-input">URL</label>
            <input
              type="url"
              id="link-url-input"
              placeholder="https://example.com"
              maxlength="2048"
              aria-describedby="link-url-error"
            >
            <p id="link-url-error" role="alert" aria-live="assertive" class="error-message"></p>
          </div>
          <div class="form-group">
            <label for="link-label-input">Label</label>
            <input
              type="text"
              id="link-label-input"
              placeholder="My Link"
              maxlength="50"
              aria-describedby="link-label-error"
            >
            <p id="link-label-error" role="alert" aria-live="assertive" class="error-message"></p>
          </div>
        </div>
        <button type="submit" aria-label="Add link">Add Link</button>
        <p id="link-limit-error" role="alert" aria-live="assertive" class="error-message"></p>
      </form>
      <div id="link-list" aria-label="Quick links list" role="list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 To-Do Life Dashboard</p>
  </footer>
</body>
</html>
